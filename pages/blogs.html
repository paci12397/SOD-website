<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog Post</title>
  <link rel="stylesheet" href="../css.css">
  <style>
.container{
    position: relative;
     padding: 0px; 
    margin-top: -200px;
    left: 0;
    right: 0;
    width: 150px;
    height: auto;

margin-left: 10px;}

    
    .vp {
      padding: 10px;
      text-align: center;
      position: fixed; 
      top: 0px; 
      left: 800px;    
      z-index: 100px;
      font-size: large;
      margin-left: 20px;
      
    }
    .vp a {
      padding: 10px;
      position: relative;
      color:black;
      text-decoration: none;
      font-weight: bold;
    }
    body {
      background-color: white;
    }
    header {
      background-color: white;
      padding: 10px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #ccc;
    }
    .search-bar input {
      border-radius: 25px;
      padding: 8px 15px;
      width: 250px;
    }
    .upload-section, .post-section {
      background: rgb(255, 255, 255);
      padding: 40px;
      margin: 30px;
      border-radius: 15px;
      margin-left: 10px;
    
    }
    .preview {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    .preview img, .preview video {
      width: 120px;
      height: 90px;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    textarea {
      width: 100%;
      height: 100px;
      border-radius: 5px;
      padding: 10px;
    }
    button {
      margin-top: 10px;
      padding: 8px 20px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
    }
    .btn-download { background: #28a745; color: white; }
    .btn-post { background: blue; color: white; }
    
    .gallery { margin-top: 20px; }
    .download { margin-left: 100px; }
    .action-buttons button {
      margin-right: 5px;
      background-color: #eee;
    }
    .margin-top {
      margin-top: -40px;
    }
  </style>
</head>
<body>

  
   

  <div class="upload-section">
<img src="../assets/Capture d'écran 2025-05-06 031823.png" alt="my image" width="140" height="140" class="margin-top">

    <div class="vp" style="margin-top: 40px; margin-left: -50px;">
      <a href="home.html">home</a>
      <a href="about.html">about</a>
      <a href="skills.html">skills</a>
      <a href="contact.html">contact</a>
      <a href="login.html">login</a>
      <a href="blogs.html">blogs</a>
      <a href="sign-up.html">Sign-Up</a>
    </div>
  </div>

  <header>
    <form class="search-bar" action="https://www.google.com/search" method="get">
      <input type="text" placeholder="Search anything..." name="q" />
      <button type="submit">Search</button>
    </form>
  </header>

  <div class="download">
    <h3>Upload Images</h3>
    <input type="file" id="fileInput" multiple accept="image/*">
    <div class="preview" id="previewArea"></div>
    <button class="btn-download" onclick="downloadImages()">Download</button>
  </div>

  <div class="post-section">
    <h3>Create Blog Post</h3>
    <textarea id="postContent" placeholder="Write your blog post here..."></textarea><br>
    <button class="btn-post" onclick="postBlog()">Post</button>
    <button class="btn-delete" onclick="clearAllPosts()">Clear All</button>
    <div class="gallery" id="blogPosts"></div>
  </div>

  
  <script src="../js.js/extension.js"></script>

</body>
</html>
