<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign-Up</title>
  <link rel="stylesheet" href="css.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: white;
      margin: 0;
      padding: 0;
    }

    .vp {
      background-color: white;
      padding: 10px;
      text-align: center;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      font-size: smaller;
      margin-left: 300px;
      margin-top: 20px;
      
    }

    .vp a {
      margin: 0 15px;
      color: black;
      text-decoration: none;
      font-weight: bold;
    }

    .signup-container {
      margin-top: 120px;
      display: flex;
      justify-content: center;
    }

    form {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      width: 300px;
      
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #0077cc;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #005fa3;
    }

    #message {
      color: red;
      text-align: center;
    }




/* Responsive Design Add-on */
@media (max-width: 1200px) {
  .vp {
    left: 50%;
    transform: translateX(-50%);
    flex-wrap: wrap;
  }

  .vp a {
    display: inline-block;
    margin: 5px;
    font-size: 16px;
  }

  .po {
    margin-left: 0;
    text-align: center;
  }

  .bb, .k {
    margin-left: 0;
    text-align: center;
  }
}

@media (max-width: 768px) {
  .vp {
    position: static;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .vp a {
    padding: 8px;
    font-size: 14px;
  }

  .container {
    margin: 0 auto;
    width: 120px;
  }

  footer {
    padding: 20px;
    margin: 0;
  }

  .d p {
    padding: 0 10px;
    font-size: 14px;
    line-height: 1.5;
  }
}

@media (max-width: 480px) {
  .vp a {
    font-size: 12px;
    padding: 6px;
  }

  .container img {
    width: 100px;
    height: 100px;
  }

  footer p, .k {
    font-size: 12px;
  }

  .d p {
    font-size: 12px;
  }
}

h3  { position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background:  #f1f1f1;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
  z-index: 9999;
  text-align: center;
  text-transform: lowercase;
  text-decoration:#f1f1f1 ;
}

  </style>
</head>
<body>

  <div id="loader">
    <h3>Loading...</h3>
</div>


  <div class="vp">
    <a href="home.html">Home</a>
    <a href="about.html">About</a>
    <a href="skills.html">Skills</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
    <a href="blogs.html">Blogs</a>
    <a href="sign-up.html">Sign-Up</a>
  </div>

  <div class="signup-container">
    <form id="signupForm">
      <h2>Sign-Up</h2>
      <input type="text" id="mushimirepacifique" placeholder="Full Name" required />
      <input type="email" id="pacy@gmail.com" placeholder="Email Address" required />
      <input type="text" id="12345" placeholder="License Number" required />
      <input type="password" id="gihogwe" placeholder="Password" required />
      <button type="submit">Sign Up</button>
      <p id="message"></p>
    </form>
  </div>

  <script src="../js.js/px.js"></script>

</body>
</html>
